services:
  media-center:
    image: ghcr.io/workerspages/metube-alist-emby:latest
    container_name: media-center
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./downloads:/downloads
      - ./config:/config
    environment:
      - TZ=${TZ:-Asia/Shanghai}
