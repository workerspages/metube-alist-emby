services:
  media-center:
    image: ghcr.io/workerspages/metube-alist-emby:latest
    container_name: media-center
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./media:/media
      - ./config:/config
    environment:
      - TZ=Asia/Shanghai

      # Alist 管理员密码（请修改默认密码）
      - ALIST_USER=admin
      - ALIST_ADMIN_PASS=adminadmin

      # MetaTube Server 访问 Token（可选）
      # - METATUBE_SERVER_TOKEN=your_token

      # -----------------------------------------------
      # rclone WebDAV 服务配置
      # -----------------------------------------------
      - RCLONE_WEBDAV_REMOTE=/media
      - RCLONE_WEBDAV_PORT=8085
      # 建议设置认证信息（留空则允许匿名访问）
      - RCLONE_WEBDAV_USER=admin
      - RCLONE_WEBDAV_PASS=adminadmin

      # Emby 自动扫描配置
      # 下载完成后通知 Emby 刷新媒体库（需要设置 Emby API Key）
      # 在 Emby 后台 设置 -> 高级 -> API 密钒 中创建
      - EMBY_API_KEY=
      # -----------------------------------------------
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
