services:
  media-center:
    image: ghcr.io/workerspages/metube-alist-emby:latest
    container_name: media-center
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./media:/media
      - ./config:/config
      
      # PaaS 挂载配置 （只需挂载一个持久卷）
      - ./data:/data

    environment:
      - TZ=-Asia/Shanghai

      # Alist 管理员密码（每次启动时设置）
      - ALIST_ADMIN_PASS=adminadmin

      # rclone WebDAV 认证
      - ALIST_USER=admin
      - ALIST_PASS=adminadmin
