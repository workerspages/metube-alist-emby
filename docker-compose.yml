services:
  media-center:
    image: ghcr.io/workerspages/metube-alist-emby:latest
    container_name: media-center
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./downloads:/downloads
      - ./config:/config
    environment:
      - TZ=-Asia/Shanghai

      # Alist 管理员密码（每次启动时设置）
      - ALIST_ADMIN_PASS=adminadmin

      # rclone WebDAV 认证
      - ALIST_USER=admin
      - ALIST_PASS=adminadmin
