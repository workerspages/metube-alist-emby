services:
  media-center:
    image: ghcr.io/workerspages/metube-alist-emby:latest
    container_name: metube-alist-emby
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./media:/media
      - ./config:/config
    # -----------------------------------------------
    # FUSE 挂载支持（本地 Docker 部署时启用）
    # 启用后 Alist 网盘将通过 rclone 直接挂载到 /media/alist
    # Emby 可原生读取视频文件，无需 StrmAssistant 插件
    # PaaS 平台无需此配置，会自动回退到 .strm 模式
    # -----------------------------------------------
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - TZ=Asia/Shanghai

      # Alist 挂载模式（auto=自动检测 / mount=强制挂载 / strm=强制.strm）
      # - ALIST_MOUNT_MODE=auto

      # Alist 管理员密码（请修改默认密码）
      - ALIST_USER=admin
      - ALIST_ADMIN_PASS=changeme

      # MetaTube Server 访问 Token（可选）
      # - METATUBE_SERVER_TOKEN=your_token

      # MeTube Basic Auth 明文密码
      - METUBE_AUTH_PASS=changeme

      # 诊断面板 Basic Auth 明文密码
      - DEBUG_AUTH_PASS=changeme

      # -----------------------------------------------
      # rclone WebDAV 服务配置
      # -----------------------------------------------
      - RCLONE_WEBDAV_REMOTE=/media
      - RCLONE_WEBDAV_PORT=8085
      # 建议设置认证信息（留空则允许匿名访问）
      - RCLONE_WEBDAV_USER=admin
      - RCLONE_WEBDAV_PASS=changeme

      # Emby 自动扫描配置
      # 下载完成后通知 Emby 刷新媒体库（需要设置 Emby API Key）
      # 在 Emby 后台 设置 -> 高级 -> API 密钥 中创建
      - EMBY_API_KEY=
      # -----------------------------------------------
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
