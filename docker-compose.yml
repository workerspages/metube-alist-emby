services:
  media-center:
    image: ghcr.io/workerspages/metube-alist-emby:latest
    container_name: media-center
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./media:/media
      - ./config:/config
    environment:
      - TZ=Asia/Shanghai

      # Alist 管理员密码（每次启动时设置）
      - ALIST_ADMIN_PASS=adminadmin

      # MetaTube Server 访问 Token（可选）
      # - METATUBE_SERVER_TOKEN=your_token

      # -----------------------------------------------
      # rclone WebDAV 服务配置
      # rclone 在本项目中仅作为 WebDAV 服务端使用
      # 将容器内指定目录通过 WebDAV 协议对外暴露
      # 访问地址：http://<host>:8080/rclone/
      # -----------------------------------------------

      # 对外暴露的本地目录（无需 rclone.conf）
      - RCLONE_WEBDAV_REMOTE=/media

      # WebDAV 内部监听端口（Caddy 转发用，通常无需修改）
      - RCLONE_WEBDAV_PORT=8085

      # WebDAV 鉴权（留空则匿名可访问，建议生产环境设置）
      - RCLONE_WEBDAV_USER=
      - RCLONE_WEBDAV_PASS=
