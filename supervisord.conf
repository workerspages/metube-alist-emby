[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:emby]
command=/opt/emby-server/bin/emby-server -programdata %(ENV_EMBY_PROGRAMDATA)s
user=root
environment=HOME="/root",EMBY_PROGRAMDATA="%(ENV_EMBY_PROGRAMDATA)s",EMBY_DATA="%(ENV_EMBY_PROGRAMDATA)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:metube]
command=python3 app/main.py
directory=/app/metube
autostart=true
autorestart=true
; Only lock routing-critical vars; all others inherit from container env
environment=URL_PREFIX="/metube/",PORT="8081"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:alist]
command=/usr/local/bin/alist server --data %(ENV_ALIST_DATA)s
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40

[program:alist-mount]
; rclone FUSE 挂载 Alist WebDAV（仅 ALIST_MOUNT_MODE=mount 时运行）
command=/app/alist-mount.sh
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=45

[program:alist-strm-sync]
; STRM 文件同步（仅 ALIST_MOUNT_MODE=strm 时运行）
command=python3 /app/alist-strm-sync.py
autostart=true
autorestart=true
; 同时输出到终端和文件，文件用于诊断面板读取
stdout_logfile=/var/log/alist-strm-sync.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/var/log/alist-strm-sync.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
priority=50

[program:strm-thumb-gen]
; ffmpeg 截图服务（仅 ALIST_MOUNT_MODE=strm 时运行）
; 扫描 .strm 文件，自动生成 Emby 可识别的缩略图
command=python3 /app/strm-thumb-gen.py
autostart=true
autorestart=true
stdout_logfile=/var/log/strm-thumb-gen.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/var/log/strm-thumb-gen.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
priority=55

[program:strm-debug]
command=python3 /app/strm-debug-server.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=60

[program:qbittorrent]
command=qbittorrent-nox --webui-port=8082 --profile=/app/data/qBittorrent
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=70

[program:metatube-server]
command=sh -c '/usr/local/bin/metatube-server -port 8083 ${METATUBE_SERVER_TOKEN:+-token "$METATUBE_SERVER_TOKEN"}'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=80

[program:rclone-webdav]
command=sh -c 'rclone serve webdav "%(ENV_RCLONE_WEBDAV_REMOTE)s" \
  --addr 0.0.0.0:%(ENV_RCLONE_WEBDAV_PORT)s \
  --baseurl /rclone \
  --log-level INFO \
  ${RCLONE_WEBDAV_USER:+--user "$RCLONE_WEBDAV_USER"} \
  ${RCLONE_WEBDAV_PASS:+--pass "$RCLONE_WEBDAV_PASS"}'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=90

[program:emby-scan-watcher]
; 监听 /media 目录文件变化，自动触发 Emby 刷新媒体库
; 需要设置环境变量 EMBY_API_KEY 才会实际发送请求
command=/app/emby-scan-watcher.sh
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=100

[program:db-sync]
command=/app/db-sync.sh
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=5
